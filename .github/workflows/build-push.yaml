name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build-push.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/koratsuki/gitlab-cicd-devops-lab

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: vars
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Make GHCR package public
        continue-on-error: true
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/gitlab-cicd-devops-lab \
            -d '{"visibility":"public"}' \
            || echo "::warning::Could not set package visibility automatically. Set it manually: GitHub > Packages > gitlab-cicd-devops-lab > Package settings > Change visibility > Public."

      - name: Update image tag in k8s/deployment.yaml
        run: |
          sed -i -E "s#(image: ${IMAGE}:).*#\1${{ steps.vars.outputs.tag }}#" k8s/deployment.yaml
          if git diff --quiet; then
            echo "No manifest change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: deploy ${IMAGE}:${{ steps.vars.outputs.tag }} [skip ci]"
          git push
