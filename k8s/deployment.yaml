apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-cicd-devops-lab
  labels:
    app: gitlab-cicd-devops-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitlab-cicd-devops-lab
  template:
    metadata:
      labels:
        app: gitlab-cicd-devops-lab
    spec:
      containers:
      - name: app
        image: ghcr.io/koratsuki/gitlab-cicd-devops-lab:sha-27f0994
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
